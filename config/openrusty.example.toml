# OpenRusty example configuration.
# Copy to openrusty.toml (or pass any path via OPENRUSTY_CONFIG) and adjust.

[server]
# Address the gateway listens on. HTTP/1.1 and h2c are served on the same port
# unless http1_only (see below) is set.
listen = "127.0.0.1:8180"
# Logging verbosity: trace | debug | info | warn | error.
# The default is warn (quiet); deployments that need the per-request access
# log must set log_level = "info" explicitly.
log_level = "warn"
# Set to true to serve plain HTTP/1.1 only and skip the h2c preface sniffing
# (each connection then runs the cheaper http/1 code path).
# http1_only = false
# Grace period (milliseconds) for draining in-flight requests during the
# three-phase shutdown (stop accept -> drain -> summary). Connections still
# active when the grace elapses are force-closed. Default is 5000.
# shutdown_grace_ms = 5000

[plugins]
# Directory scanned for *.wasm plugin modules (loaded in `order`, else sorted by file name).
dir = "build/plugins"
# Execution order of plugins within a phase. Plugins missing from the list run after, by name.
order = ["vllm-kv-scheduler"]
# Hard timeout for one plugin phase invocation (milliseconds). Enforced via wasmtime epoch interruption.
timeout_ms = 50
# Per-request memory ceiling granted to each plugin instance (MiB).
max_memory_mb = 16
# Behavior when a plugin traps/times out: fail_open (decision = declined) or fail_closed (decision = deny 503).
on_failure = "fail_open"

# Per-plugin free-form settings, visible to the plugin as key/value strings.
[plugins.settings.vllm-kv-scheduler]
# How to extract the task key from the request:
#   "query:<param>"   - query string parameter
#   "path:<segment>"  - 1-based path segment
#   "body:<field>"    - top-level JSON string field of the request body (e.g. cache_salt)
extract = "query:task"
# Affinity entries expire after this many seconds, releasing the task slot.
affinity_ttl_s = "300"
# Optional cap of concurrent tasks per node (0 = unlimited).
max_tasks_per_node = "0"

[[upstreams]]
name = "vllm"
# Load balancing policy: swrr (smooth weighted round-robin) | ip_hash
balancer = "swrr"
# Retry the request on another peer when a connection-level failure occurs.
retries = 2
# Timeout for establishing the upstream connection (milliseconds).
connect_timeout_ms = 2000
# retry_on_timeout = false
# 路由超时后重试下一个 peer；默认关闭，因为 POST 重放可能使 LLM 计算成本翻倍。

  [[upstreams.peers]]
  addr = "127.0.0.1:9001"
  weight = 1

  [[upstreams.peers]]
  addr = "127.0.0.1:9002"
  weight = 1

  [[upstreams.peers]]
  addr = "127.0.0.1:9003"
  weight = 1

  [upstreams.health]
  # Passive health check: mark a peer down after `max_fails` failures
  # inside the window; `max_fails = 0` disables passive accounting
  # within `fail_window_s`; the peer recovers after `fail_timeout_s`.
  max_fails = 3
  fail_window_s = 10
  fail_timeout_s = 10

  # Active health check: periodically probe each peer via HTTP GET.
  # Uncomment to enable (defaults shown).
  # [upstreams.health.active]
  # interval_ms = 1000
  # timeout_ms = 1000
  # path = "/"
  # unhealthy_threshold = 2
  # healthy_threshold = 2

[[routes]]
# Requests whose path starts with this prefix are forwarded to `upstream`.
path_prefix = "/v1"
upstream = "vllm"
# Whole-request timeout (milliseconds); 0 disables.
timeout_ms = 30000
# Optional exact host constraint: only requests whose Host header (port
# stripped, case-insensitive) equals this value match the route. Routes
# without `host` match any host; host-specific routes win over catch-alls.
# host = "api.example.com"

[[routes]]
path_prefix = "/"
upstream = "vllm"
timeout_ms = 30000

# --- Role-based multi-listener (sidecar mode) -------------------------------
# Uncommenting ANY [[server.listeners]] entry below switches the gateway into
# multi-socket mode, and those entries become the ONLY authority for which
# sockets are bound: the `listen` under [server] above is then ignored (a
# warning is logged once at boot). With no [[server.listeners]] at all, the
# gateway derives a single inbound listener from [server] listen/http1_only,
# the backward-compatible single-socket shape (management routes included).
#
# Rules: at most one listener per role (inbound | outbound | admin) and no
# duplicated address. `http1_only` applies to inbound/outbound only; an admin
# listener ignores it and serves the /openrusty/* management routes ONLY
# (when an admin listener exists, those routes are removed from the data
# ports). Roles follow the linkerd sidecar split:
#   inbound  - local workload traffic entering the process
#   outbound - egress traffic leaving the mesh
#   admin    - /openrusty/status | /openrusty/reload | /openrusty/metrics
#
# Transparent interception (data plane roles only; an admin listener parses
# but ignores the flag): when `transparent = true` the socket expects traffic
# redirected by iptables/nftables REDIRECT (original destination preserved in
# SO_ORIGINAL_DST):
#   inbound  - each connection is protocol-sniffed (HTTP/1.x or h2c) within
#              `detect_timeout_ms` and then either fed to the normal plugin
#              pipeline (HTTP) or spliced as a raw TCP tunnel to the original
#              destination (opaque TLS etc.).
#   outbound - connections are dialed straight at the original destination,
#              which the proxy targets INSTEAD of the [upstream] table; no
#              per-request upstream rewriting happens on this path.
#   both     - a loop guard rejects tunnels back to any of the gateway's own
#              listener ports (a transparent listener without an iptables
#              REDIRECT rule loops every connection into itself, so all
#              traffic on it is refused by design - fail fast, not hang).
# If the original destination cannot be read (plain connection, no redirect),
# inbound degrades to the normal HTTP pipeline and outbound closes the
# connection; `http1_only` only shapes the degraded inbound path - the
# sniffed protocol decides the fast path.
# `detect_timeout_ms` must be > 0 whenever `transparent = true`.
#
# [[server.listeners]]
# role = "inbound"
# listen = "0.0.0.0:4143"
# # http1_only = false
# # transparent = false
# # detect_timeout_ms = 3000
#
# [[server.listeners]]
# role = "outbound"
# listen = "127.0.0.1:4140"
# # http1_only = false
# # transparent = false
#
# [[server.listeners]]
# role = "admin"
# listen = "127.0.0.1:4191"
