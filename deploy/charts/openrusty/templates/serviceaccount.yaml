{{- if and .Values.rbac.create .Values.ingress.serviceAccount.create }}
{{/* ServiceAccount the ingress gateway watches Ingresses/Secrets through;
     rendered together with rbac.yaml (same gate) so `rbac.create=false`
     leaves the identity plane entirely to the operator. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openrusty.ingressServiceAccountName" . }}
  labels:
    {{- include "openrusty.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
{{- end }}
