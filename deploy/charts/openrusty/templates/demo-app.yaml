{{- if .Values.demo.enabled }}
{{/* Demo workload: the fixture (tests/fixtures/inject/deployment.yaml)
     with the injection result written out statically. `scripts/chart-lint.sh`
     diffs this shape against a fresh `openrusty inject` of the same
     fixture, so the two must stay in sync. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrusty.demoName" . }}-openrusty-config
  labels:
    {{- include "openrusty.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo
data:
  openrusty.toml: |
    # Generated by `openrusty inject`; edit with care - the sidecar
    # restarts with this file verbatim.
    [server]
    listen = "0.0.0.0:{{ .Values.ports.inbound }}"
    log_level = "warn"

    [[server.listeners]]
    role = "inbound"
    listen = "0.0.0.0:{{ .Values.ports.inbound }}"
    transparent = true

    [[server.listeners]]
    role = "outbound"
    listen = "0.0.0.0:{{ .Values.ports.outbound }}"
    transparent = true

    [[server.listeners]]
    role = "admin"
    listen = "0.0.0.0:{{ .Values.ports.admin }}"

    [plugins]
    # No plugins volume: a missing dir is "no plugins", never fatal.
    dir = "/dev/null-plugins"

    [egress]
    mode = "direct"
    [ingress]
    enabled = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openrusty.demoName" . }}
  labels:
    {{- include "openrusty.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "openrusty.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: demo
  template:
    metadata:
      labels:
        {{- include "openrusty.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: demo
      annotations:
        config.openrusty.io/inject: "enabled"
        config.openrusty.io/skip-inbound-ports: "9090,15002"
        config.openrusty.io/opaque-ports: "8443"
    spec:
      containers:
        - name: echo
          image: ghcr.io/openrusty/echo:0.0.0-placeholder
          ports:
            - name: http
              containerPort: 8080
        - name: openrusty-proxy
          image: {{ include "openrusty.image" . }}
          args:
            - /etc/openrusty/openrusty.toml
          env:
            - name: OPENRUSTY_OPAQUE_PORTS
              value: "8443"
          ports:
            - name: proxy
              containerPort: {{ .Values.ports.inbound }}
            - name: outbound
              containerPort: {{ .Values.ports.outbound }}
            - name: admin
              containerPort: {{ .Values.ports.admin }}
          securityContext:
            runAsUser: {{ .Values.proxyUid }}
          volumeMounts:
            - name: openrusty-config
              mountPath: /etc/openrusty
              readOnly: true
      initContainers:
        - name: openrusty-init
          image: {{ include "openrusty.image" . }}
          command:
            - openrusty
            - iptables-init
            - --proxy-uid
            - "{{ .Values.proxyUid }}"
            - --inbound-port
            - "{{ .Values.ports.inbound }}"
            - --outbound-port
            - "{{ .Values.ports.outbound }}"
            - --ignore-inbound-ports
            - "4191,9090,15002"
          securityContext:
            privileged: true
      volumes:
        - name: openrusty-config
          configMap:
            name: {{ include "openrusty.demoName" . }}-openrusty-config
{{- end }}
